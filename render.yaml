# Render Blueprint for the always-on Telegram worker. The web app stays on Vercel.
services:
  - type: worker            # use "web" + healthCheckPath on plans that require it
    name: secretary-telegram-worker
    runtime: docker
    rootDir: worker
    plan: starter           # must be an always-on plan; free tier sleeps and would drop Telegram
    autoDeploy: true
    envVars:
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }
      - { key: SESSION_ENC_KEY, sync: false }
      - { key: OPENAI_API_KEY, sync: false }
      - { key: LOG_LEVEL, value: info }
