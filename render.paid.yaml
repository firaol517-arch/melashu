# Render Blueprint, PAID always-on (Starter). Use for real customers; the default render.yaml is the free tier.
services:
  - type: worker            # use "web" + healthCheckPath on plans that require it
    name: secretary-telegram-worker
    runtime: docker
    rootDir: worker
    plan: starter           # must be an always-on plan; free tier sleeps and would drop Telegram
    autoDeploy: true
    envVars:
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }
      - { key: SESSION_ENC_KEY, sync: false }
      - { key: AI_API_KEY, sync: false }
      - { key: AI_BASE_URL, value: "https://generativelanguage.googleapis.com/v1beta/openai/" }
      - { key: AI_MODEL, value: gemini-3.8-flash }
      - { key: LOG_LEVEL, value: info }
